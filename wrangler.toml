name = "aiovtue-blog"   # Worker 名，可以改
main = "worker/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
# valaxy 项目没有 404.html，未知路径统一回落到 index.html（与 Pages 版 _redirects 行为一致）
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"   # 这个不能动
database_name = "aiovtue-blog"   # 名字不一样也要改，最好一样
database_id = ""   # 留空即可：脚本会按 database_name 查回真实 id 并写回本文件
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"   # 这个不能动
bucket_name = "aiovtue-blog"   # 名字不一样也要改，最好一样

[vars]
SITE_URL = "https://live.yybb.us"
